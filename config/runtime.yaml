# Single source of runtime pins and schedules.
# install.slurm, run.slurm, scripts/ and source/wildfire_swarm read this file.

image:
  base: nvcr.io/nvidia/isaac-sim:5.1.0
  base_digest: ""            # filled from install.slurm pull log (sif/digests.txt)
  isaac_sif: isaac_pegasus.sif
  humble_base: docker://osrf/ros:humble-desktop
  humble_sif: humble_ws.sif

pegasus:
  repo: https://github.com/PegasusSimulator/PegasusSimulator
  tag: v5.1.0
  commit: 644da37e9d5268e5f9a34e78bdcfd57a8bab82b4
  tested_driver: "550.163.01"   # from Pegasus v5.1.0 installation docs

forest:
  repo: https://github.com/joevento/Nvidia-Isaac-Sim-Procedual-Forest-Generator
  generator_commit: 9e5fcbe3fd11974f7b72f1781d522ae6e2b8734d   # HEAD seen 2026-11-17; re-pin at export
  stage: assets/stages/forest.usda

rates:
  physics_hz: 240            # physics_dt = 1/240 (overrides Pegasus default 1/250)
  render_hz: 60              # rendering_dt = 1/60
  uav_raw_imu_hz: 240        # Pegasus IMU update_rate (default 250)
  imu_report_hz: 60          # four-sample average, stamped at window midpoint
  wheel_odom_hz: 60
  gps_hz: 5
  heading_hz: 5
  thermal_hz: 10             # Iris thermal + matched depth
  ugv_thermal_hz: 5          # Carter forward thermal view
  lidar_hz: 10
  mission_hz: 2
  lease_renew_hz: 1

sensors:
  uav_thermal_resolution: [640, 480]
  ugv_thermal_resolution: [320, 240]   # reduced to fit four Carters on one GPU
  thermal_depth_max_skew_s: 0.05

dds:
  rmw: rmw_fastrtps_cpp
  profile: containers/fastdds_udp.xml  # UDPv4 only (no cross-container shared memory)
  localhost_only: 1
  domain_id_rule: "1 + SLURM_JOB_ID % 100"

slurm:
  # Torch: --account required, no --partition, GPU via --gres + --constraint.
  # Request only what a step needs; low GPU utilization jobs are auto-cancelled
  # (L40S nodes gl*: cancel < 50 %, warn < 70 %), so GPU steps are short and render-bound.
  gpu_gres: "gpu:1"
  gpu_constraint: l40s          # 48 GB VRAM + RT cores; A100/H100/H200/B200 lack RT cores (unsupported by Isaac Sim)
  # --mem is host RAM (Go2 used 10 CPUs / 20 GB). GPU memory is not requested: the job gets the
  # whole L40S (48 GB VRAM). Values are raised only where a step needs it, and measured
  # usage (sacct MaxRSS, gpu_summary.json) is recorded to trim them further.
  gpu_short: {cpus: 10, mem: 20G,  time: "00:20:00"}   # g1_startup: Go2 sizing, no scene loaded
  gpu:       {cpus: 10, mem: 32G,  time: "01:00:00"}   # g3_scene: NVIDIA 5.1 minimum host RAM is 32 GB
  gpu_large: {cpus: 16, mem: 64G,  time: "04:00:00"}   # later four-AMR runs (re-sized from G3 measurements)
  install:   {cpus: 10, mem: 20G,  time: "04:00:00"}   # CPU only, Go2 install sizing

gpu_budget:
  # Isaac Sim 5.1 requirements: >= 16 GB VRAM (ideal 48 GB), 32-64 GB RAM, Linux driver 580.65.06 tested.
  vram_gb_available: 48
  vram_gb_estimate_g3: 10       # Kit/RTX ~4 + forest textures <= 3.8 + instanced geometry ~0.3 + Carter ~0.6 + 2 cameras ~1
  vram_gb_estimate_full: 16     # + 3 Carters, 4 RTX LiDARs, 5 thermal/depth render products
  warn_fraction: 0.8            # run.slurm flags a job whose peak VRAM exceeds 80 % of the GPU
  tested_driver: "580.65.06"

assets:
  isaac_root_url: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.1

nvidia_env:
  ACCEPT_EULA: "Y"
  PRIVACY_CONSENT: "N"

seed: 20261117
